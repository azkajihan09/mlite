<div id="form_rincian">

  <!-- Baris 1: Info Pasien + Form Input -->
  <div class="col-md-12">
    <div class="panel panel-default">
      <div class="panel-heading" style="padding:8px 15px;">
        <h4 class="panel-title" style="margin:0;"><i class="fa fa-flask"></i> Input Pemeriksaan Laboratorium</h4>
      </div>
      <div class="panel-body">
        <div class="row">
          <!-- Kolom kiri: info pasien + tanggal -->
          <div class="col-md-5">
            <div class="form-horizontal">
              <div class="form-group">
                <label class="col-sm-4 control-label">No. RM</label>
                <div class="col-sm-8">
                  <input type="text" name="no_rkm_medis" class="form-control" placeholder="Nomor Rekam Medik" value="" readonly>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-4 control-label">Nama Pasien</label>
                <div class="col-sm-8">
                  <input type="text" name="nm_pasien" class="form-control" placeholder="Nama pasien" value="" readonly>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-4 control-label">ID Rawat</label>
                <div class="col-sm-8">
                  <input type="text" name="no_rawat" placeholder="ID Rawat" class="form-control" value="" readonly>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-4 control-label">Tanggal</label>
                <div class="col-sm-4">
                  <input type="text" id="tgl_perawatan" name="tgl_perawatan" class="form-control tanggal" value="{?=date('Y-m-d')?}">
                </div>
                <label class="col-sm-1 control-label" style="padding-left:0;">Jam</label>
                <div class="col-sm-3">
                  <input type="text" id="jam_reg" name="jam_reg" class="form-control jam" value="{?=date('H:i:s')?}">
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-4 control-label">Status</label>
                <div class="col-sm-8">
                  <input type="text" name="status" class="form-control" value="{if: $type == 'ranap'}Ranap{else}Ralan{/if}" readonly>
                </div>
              </div>
            </div>
          </div>
          <!-- Kolom kanan: jenis terpilih + dokter + tombol -->
          <div class="col-md-7">
            <div class="form-horizontal">
              <div class="form-group">
                <label class="col-sm-3 control-label">Jenis Dipilih</label>
                <div class="col-sm-9">
                  <div class="input-group">
                    <input type="hidden" name="kd_jenis_prw" value="">
                    <input type="hidden" name="kat" value="">
                    <input type="text" name="nm_perawatan" class="form-control" placeholder="— Pilih dari daftar di bawah —" value="" readonly style="background:#fffbe6;">
                    <span class="input-group-addon" style="background:#fffbe6;"><i class="fa fa-hand-o-down"></i></span>
                  </div>
                </div>
              </div>
              <div class="form-group">
                <label class="col-sm-3 control-label">Biaya</label>
                <div class="col-sm-5">
                  <input type="text" id="biaya" name="biaya" class="form-control text-right" placeholder="Rp. 0" readonly>
                </div>
                <label class="col-sm-1 control-label" style="padding-left:0;">Jml</label>
                <div class="col-sm-3">
                  <input type="number" id="jml_tindakan" name="jml_tindakan[]" class="form-control text-center" value="1" min="1">
                </div>
              </div>
              <div class="form-group" id="rawat_jl_dr">
                <label class="col-sm-3 control-label">Dokter</label>
                <div class="col-sm-6">
                  <input type="text" name="nama_provider" id="nama_provider" class="form-control" placeholder="Cari nama dokter..." value="">
                  <ul class="list-group" id="kode_providerList" style="z-index:1000;position:absolute;width:100%;"></ul>
                </div>
                <label class="col-sm-1 control-label" style="padding-left:0;">Kode</label>
                <div class="col-sm-2">
                  <input type="text" name="kode_provider" id="kode_provider" class="form-control" value="">
                </div>
              </div>
              <div class="form-group">
                <div class="col-sm-offset-3 col-sm-9">
                  <button type="button" class="btn btn-primary" id="simpan_rincian" {if: $this->core->checkPermission($this->core->getUserInfo('username'), 'can_create', 'laboratorium') == false}disabled{/if}>
                    <i class="fa fa-save"></i> Masukkan Rincian
                  </button>
                  <button type="button" class="btn btn-success" id="selesai">
                    <i class="fa fa-check"></i> Selesai
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Baris 2: Daftar Jenis Pemeriksaan -->
  <div class="col-md-12">
    <div class="panel panel-default">
      <div class="panel-heading" style="padding:8px 15px;">
        <div class="row">
          <div class="col-sm-6">
            <h4 class="panel-title" style="margin:4px 0;"><i class="fa fa-list-alt"></i> Daftar Jenis Pemeriksaan</h4>
          </div>
          <div class="col-sm-6">
            <div class="input-group input-group-sm">
              <span class="input-group-addon"><i class="fa fa-search"></i></span>
              <input type="text" id="cari_layanan" name="layanan" class="form-control" placeholder="Cari nama pemeriksaan...">
              <span class="input-group-btn">
                <button class="btn btn-default" type="button" id="btn_reset_layanan" title="Reset"><i class="fa fa-times"></i></button>
              </span>
            </div>
          </div>
        </div>
      </div>
      <div class="panel-body" style="padding:0;">
        <div id="layanan" style="max-height:320px;overflow-y:auto;">
          <!-- diisi otomatis via AJAX -->
          <div class="text-center" style="padding:30px;color:#aaa;">
            <i class="fa fa-spinner fa-spin fa-2x"></i><br>Memuat data pemeriksaan...
          </div>
        </div>
      </div>
      <div class="panel-footer" style="padding:6px 15px;font-size:12px;color:#888;">
        <i class="fa fa-info-circle"></i> Klik baris untuk memilih jenis pemeriksaan
      </div>
    </div>
  </div>

</div>
<script>
  // Provider autocomplete
  $('input:text[name=nama_provider]').on('input', function(e) {
    var baseURL = mlite.url + '/' + mlite.admin;
    var url = baseURL + '/laboratorium/providerlist?t=' + mlite.token;
    var query = $(this).val();
    if (query != "") {
      $.ajax({
        url: url,
        method: "POST",
        data: { query: query },
        success: function(data) {
          $('#kode_providerList').fadeIn().html(data);
        }
      });
    }
    $('#kode_providerList').fadeIn();
  });

  $('#kode_providerList').on('click', 'li', function() {
    $('#nama_provider').val($(this).text().split(': ')[1]);
    $('#kode_provider').val($(this).text().split(': ')[0]);
    $('#kode_providerList').fadeOut();
  });
</script>
