<div class="table-responsive" style="margin:0;">
  <table class="table table-hover table-condensed" style="margin:0;">
    <thead>
      <tr style="background:#f5f5f5;">
        <th style="width:120px;white-space:nowrap;">ID Tindakan</th>
        <th>Nama Pemeriksaan</th>
        <th style="width:140px;text-align:right;white-space:nowrap;">Tarif</th>
        <th style="width:70px;text-align:center;">Pilih</th>
      </tr>
    </thead>
    <tbody>
      {if: $layanan}
      {loop: $layanan}
      <tr class="pilih_layanan"
        data-kd_jenis_prw="{?=isset_or($value.kd_jenis_prw)?}"
        data-nm_perawatan="{?=isset_or($value.nm_perawatan)?}"
        data-biaya="{?=isset_or($value.total_byr)?}"
        data-kat="laboratorium"
        style="cursor:pointer;"
        title="Klik untuk memilih: {?=isset_or($value.nm_perawatan)?}">
        <td style="white-space:nowrap;">
          <span class="label label-default">{?=isset_or($value.kd_jenis_prw)?}</span>
        </td>
        <td>{?=isset_or($value.nm_perawatan)?}</td>
        <td style="text-align:right;white-space:nowrap;">
          <strong>Rp {?= number_format($value.total_byr,0,',','.')?}</strong>
        </td>
        <td style="text-align:center;">
          <span class="btn btn-xs btn-primary"><i class="fa fa-plus"></i></span>
        </td>
      </tr>
      {/loop}
      {else}
      <tr>
        <td colspan="4" class="text-center" style="padding:20px;color:#aaa;">
          <i class="fa fa-search fa-2x"></i><br>
          <small>Tidak ada data pemeriksaan ditemukan</small>
        </td>
      </tr>
      {/if}
    </tbody>
  </table>
</div>
<style>
  .pilih_layanan:hover { background-color: #e8f4fd !important; }
  .pilih_layanan.selected { background-color: #d4edda !important; }
</style>
