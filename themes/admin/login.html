<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>{$mlite.nama_instansi}</title>
    <link rel="icon" href="{?=url()?}/{$mlite.logo}" type="image/x-icon">
    <link href="{$mlite.path}/assets/css/{$mlite.theme_admin}.min.css?v={$mlite.version}" rel="stylesheet">
    <link href="{?= url(THEMES.'/admin/css/style.css?v='.$mlite.version) ?}" rel="stylesheet">
    <link href="{$mlite.path}/assets/css/font-awesome.css?v={$mlite.version}" rel="stylesheet">
    <!-- PWA Support -->
    <link rel="manifest" href="{$mlite.path}/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="mLITE" />
    <meta name="apple-mobile-web-app-title" content="mLITE" />
    <meta name="theme-color" content="#222" />
    <meta name="msapplication-navbutton-color" content="#222" />
    <meta name="apple-mobile-web-app-status-bar-style" content="green-translucent" />
    <meta name="msapplication-starturl" content="{$mlite.path}" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="icon" sizes="128x128" href="{$mlite.path}/assets/images/icon-128x128.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="{$mlite.path}/assets/images/icon-128x128.png" />
    <link rel="icon" sizes="192x192" href="{$mlite.path}/assets/images/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="{$mlite.path}/assets/images/icon-192x192.png" />
    <link rel="icon" sizes="256x256" href="{$mlite.path}/assets/images/icon-256x256.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="{$mlite.path}/assets/images/icon-256x256.png" />
    <link rel="icon" sizes="384x384" href="{$mlite.path}/assets/images/icon-384x384.png" />
    <link rel="apple-touch-icon" sizes="384x384" href="{$mlite.path}/assets/images/icon-384x384.png" />
    <link rel="icon" sizes="512x512" href="{$mlite.path}/assets/images/icon-512x512.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="{$mlite.path}/assets/images/icon-512x512.png" />
    <!-- End PWA Support -->
    <script src="{$mlite.path}/assets/jscripts/jquery.min.js?v={$mlite.version}"></script>
    <script src="{?=url(THEMES.'/admin/js/kalypto.min.js?v='.$mlite.version) ?}"></script>
    <style>
    body {
        position: absolute;
        top: 0; bottom: 0; left: 0; right: 0;
        height: 100%;
    }
    body:before {
      content: "";
      position: absolute;
      background: url('{?=url()?}/themes/admin/img/klink.jpg');
      background-size: cover;
      background-position: center;
      z-index: -1;
      height: 100%; width: 100%;
      top: 0; left: 0;
      filter: blur(2px) brightness(0.85);
    }
    </style>
</head>

<body>

	<section id="login">
        <div class="panel panel-default">
            <div class="panel-heading" style="text-align:center; background: rgba(255,255,255,0.7); border-radius: 12px 12px 0 0; padding-top: 30px;">
                <img src="{?=url()?}/themes/admin/img/Klinik Rozan.png" alt="Logo Klinik Rozan" style="max-width:110px; margin-bottom:10px;">
                <h2 style="font-weight:bold; color:#007b8a; margin-bottom:6px;">KLINIK ROZAN</h2>
                <div style="font-size:1.1em; color:#333; margin-bottom:10px;">
                  Jalan Mataratii RT 03 RW 04<br>Kel. Batumandi, Kec. Batumandi, Kab. Balangan
                </div>
            </div>
            <div class="panel-body">
        		<form action="{$_SERVER['REQUEST_URI']}" method="POST">
                {if: isset($_SESSION['mlite_otp_pending'])}
                    <h4 class="text-center" style="margin-bottom:20px;">Verifikasi WhatsApp OTP</h4>
                    <div class="form-group">
                        <div class="input-group">
                            <div class="input-group-addon"><i class="fa fa-key"></i></div>
                            <input type="text" name="otp_code" class="form-control" placeholder="6-digit Kode OTP" pattern="\d{6}" title="Masukkan 6 digit angka OTP" required autocomplete="off" />
                        </div>
                    </div>
                    <div class="form-group">
                        <button type="submit" name="verify_otp" class="btn btn-primary btn-block">Verifikasi OTP</button>
                        <a href="{?=url([ADMIN])?}?cancel_otp=1" class="btn btn-default btn-block" style="margin-top:10px;">Batal (Login Ulang)</a>
                    </div>
                {else}
                  	<div class="form-group">
                        <div class="input-group">
                            <div class="input-group-addon"><i class="fa fa-user"></i></div>
                            <input type="text" name="username" class="form-control" placeholder="Nama Pengguna" required />
                        </div>
                  	</div>
                  	<div class="form-group">
                        <div class="input-group">
                            <div class="input-group-addon"><i class="fa fa-lock"></i></div>
                            <input type="password" name="password" class="form-control" placeholder="Password" required />
                        </div>
                  	</div>
                    <div class="form-group">
                        <label class="remember-me pull-left">
                            <input type="checkbox" name="remember_me" />
                            Ingat saya
                        </label>
                        <button type="submit" name="login" class="btn btn-primary pull-right">Sign In</button>
                    </div>
                    </div>
                {/if}
        		</form>
            </div>
        </div>
		{if: $mlite.notify}
		<div id="notify" class="alert-{$mlite.notify.type} animated shake">{$mlite.notify.text}</div>
		{/if}
	</section>

  <footer class="visible-lg visible-md bg-primary" style="padding-bottom:30px;z-index:1000;">
    <p class="pull-right">
      Made with <i class="fa fa-heart text-danger"></i> by <a href="https://basoro.id/" target="_blank"><b>drg. F. Basoro</b>.</a>
      {$mlite.powered}.
    </p>
  </footer>

  <!-- PWA Support -->
  <script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
      .register("{$mlite.path}/service-worker.js")
      .then((swReg) => {
        //console.log("Service Worker is registered", swReg);
      })
      .catch((err) => {
        //console.error("Service Worker Error", err);
      });
    });
  }
  </script>
  <!-- End PWA Support -->

  <script>
  $(':checkbox').kalypto();
  </script>
</body>
</html>
